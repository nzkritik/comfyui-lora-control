<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- LoRA Control: a stack of LoRA layers, with a shuffle badge for random/sequence picking. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2733"/>
      <stop offset="1" stop-color="#11161d"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="84" fill="url(#bg)"/>
  <!-- three layers, bottom to top -->
  <g stroke-linejoin="round" stroke-width="10" stroke="#11161d" transform="translate(-18 -38)">
    <path d="M200 262 L336 196 L200 130 L64 196 Z" transform="translate(0 76)" fill="#3f789e"/>
    <path d="M200 262 L336 196 L200 130 L64 196 Z" transform="translate(0 38)" fill="#88aa88"/>
    <path d="M200 262 L336 196 L200 130 L64 196 Z" fill="#a1309b"/>
  </g>
  <!-- shuffle badge -->
  <circle cx="296" cy="296" r="70" fill="#f2f2f2" stroke="#11161d" stroke-width="10"/>
  <g fill="none" stroke="#11161d" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M258 268 L334 324"/>
    <path d="M258 324 L284 305 M308 287 L334 268"/>
    <path d="M308 268 L334 268 L334 294"/>
    <path d="M308 324 L334 324 L334 298"/>
  </g>
</svg>
