name: Publish to Comfy Registry

# Manual for now. Once the repo is public and the REGISTRY_ACCESS_TOKEN secret
# is set, add a trigger on pushes to main that change pyproject.toml, so every
# version bump publishes:
#   push:
#     branches: [main]
#     paths: [pyproject.toml]
on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'nzkritik' }}
    steps:
      # The action checks the repo out itself.
      - uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
